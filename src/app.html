<!doctype html>
<html lang="%paraglide.locale%">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- The Three-State Lamp pre-paint (ADR-0023 D3, now ADR-0063 D2): the
		 inline script below is GENERATED from the base applier —
		 scripts/sync-theme-applier.mjs — never edit it by hand. -->
		<!-- container-base:theme-applier BEGIN (generated — do not edit by hand; scripts/sync-theme-applier.mjs) -->
		<script>
			try {
				var m = location.search.match(/[?&]profile=([^&]*)/);
				var prof = m ? m[1].replace(/[^A-Za-z0-9_-]/g, '').slice(0, 40) : '';
				var k = 'dsi-theme' + (prof ? '_' + prof : '');
				var t = localStorage.getItem(k);
				if (t !== 'light' && t !== 'dark' && t !== 'system') t = 'system';
				document.documentElement.dataset.theme =
					t === 'dark' || (t === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)
						? 'dark'
						: 'light';
			} catch (e) {
				document.documentElement.dataset.theme = 'light';
			}
		</script>
		<!-- container-base:theme-applier END -->
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="tap">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
