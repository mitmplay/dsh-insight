- insert:
    - id: preset-app-dev
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: app-dev
        name: App Dev
        description: >-
          Full application-development agent: bash, file edit/search, skills, plan mode, goals, subagents, workflows, and web lookup, with a build-and-verify persona.
        order: 10
        plugins:
          # The `app-dev` agent preset: a full-capability application developer.
          #
          # Same tool stack as the shipped `standard` preset (bash/pwsh, filesystem edit
          # and search, skills, goals, plan mode, subagents, workflows, web, todo, ask),
          # with a persona specialized for building and shipping applications.
          #
          # AGENT-PLANE composition: mounted once per process under a standing scope;
          # sessions naming it join by scope parentage. Host plane keeps the registries,
          # sandbox, approval stack, persistence, and the model route. Service rows MUST
          # sit inside a group carrying an `isolate` realm (entry-local private instance)
          # or `dsh-agent-presets` rejects the mount.

          # ── identity ────────────────────────────────────────────────────────────────

          # This preset's persona, shadowing the deployment default for joined agents.
          # `{{model}}` and `{{cwd}}` resolve from the agent's own route and workspace.
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are app-dev, an application development agent powered by the {{model}} model.
                Your working directory is {{cwd}}.

                You build, debug, and ship software end to end. Prefer existing patterns
                and dependencies over new machinery; keep changes minimal and reviewed.
                Verify work by running code, tests, and typechecks before claiming done.
                When a task spans many steps, write a plan first, track it with todos,
                and delegate isolated read-only investigation to subagents.

                Prefer one program over consecutive programs. When the next planned
                run_code needs no decision that depends on seeing the previous program's
                uncondensed result, batch the steps into a single program and chain them
                with variables. Split only when a stage's outcome must re-enter your
                reasoning, or when the combined program would exceed the timeout (then
                use a background job).

                When a program enumerates files or targets, cover the full symmetric
                set in that one program; use try/catch fallbacks for missing members
                instead of follow-up probes.

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

          # ── shell ───────────────────────────────────────────────────────────────────

          # One-shot shell tools; executors (bash-sandbox/pwsh-sandbox) stay host-plane.
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'

          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'

          # ── filesystem ──────────────────────────────────────────────────────────────

          # Both register into the host `tools` registry and provide nothing: no realm.
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

          # ── background jobs ────────────────────────────────────────────────────────

          # Model-facing controls only; the task registry stays on the host plane.
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'

          # ── skills ──────────────────────────────────────────────────────────────────

          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          # ── goals ───────────────────────────────────────────────────────────────────

          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'

          # ── plan mode ───────────────────────────────────────────────────────────────

          # Plan state is per-agent by nature: entry-local realm is the correct lifetime.
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed to implementation.

          # ── compaction ──────────────────────────────────────────────────────────────

          # compaction-basic reads toolResultPrune through ctx.get: same realm.
          # command-compact and the pruner live INSIDE the group — 0.2.1.x rejects
          # preset rows that consume an isolate realm from outside it.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'

              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

          # ── delegation and workflows ────────────────────────────────────────────────

          # The subagents registry and spawn/fork backends stay host-plane; this preset
          # contributes the delegation tools. Workflows share one entry-local realm.
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'

              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  backgroundMode: continuable

              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable

              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn

              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'

              - id: tool-ralph
                name: '@deepseek-ai/dsh-tool-ralph'
                config:
                  subagentProvider: spawn
                  maxRounds: 64

          # ── remaining model-facing rows ─────────────────────────────────────────────

          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true

          # The web service and its search provider stay in the host composition; only
          # the model-facing tool is per-session. Docs lookup for developers.
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: false
              searchTimeoutMs: 60000

          # ── presentation ────────────────────────────────────────────────────────────

          # PTC mode for this agent alone — the run_code front door (one callable tool;
          # every other tool reaches the model only as tools.name(...) sub-calls inside
          # a program). The row waits for the host's codeRuntime rather than assuming
          # it: a deployment that composes no TypeScript runtime fails this preset at
          # mount, naming this id, instead of at the first request.
          - id: tool-presentation
            name: '@deepseek-ai/dsh-agent-tool-presentation'
            config:
              mode: ptc
- insert:
  # ── The Glass Browser (ADR-0029 W3): the agent's browser hands ───────────
  # MCP client against DSI's in-process glass-browser brain (stable listener
  # :9515; the brain lives while a browser panel is open — the client's
  # reconnect policy covers the down windows). Tools surface as
  # mcp__glass-browser__browser_* (navigate, click, snapshot, …).
  - id: preset-app-dev-glass-browser-mcp
    name: '@deepseek-ai/dsh-mcp-client'
    config:
      transport: streamable-http
      serverName: glass-browser
      url: http://127.0.0.1:9515/sse
